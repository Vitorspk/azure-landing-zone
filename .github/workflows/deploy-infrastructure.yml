name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to deploy'
        required: true
        type: choice
        options:
          - 'all'
          - '00-iam'
          - '01-networking'
          - '02-kubernetes'
      action:
        description: 'Action'
        required: true
        type: choice
        options:
          - 'plan'
          - 'apply'
          - 'destroy'
      clusters:
        description: 'Which clusters to deploy/destroy (for kubernetes module)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'dev'
          - 'stg'
          - 'prd'
          - 'sdx'
          - 'dev,stg'
          - 'dev,stg,prd'
          - 'stg,prd,sdx'
      confirm_destroy:
        description: 'Type "DESTROY" to confirm destruction of resources'
        required: false
        type: string
        default: ''

jobs:
  terraform:
    name: ${{ github.event.inputs.action == 'plan' && 'Plan' || github.event.inputs.action == 'apply' && 'Apply' || 'Destroy' }} - ${{ github.event.inputs.module }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set Job Title
        id: job-title
        run: |
          ACTION="${{ github.event.inputs.action }}"
          MODULE="${{ github.event.inputs.module }}"
          CLUSTERS="${{ github.event.inputs.clusters }}"
          
          # Capitalize action
          ACTION_DISPLAY=$(echo "$ACTION" | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')
          
          # Format module display
          case "$MODULE" in
            "all")
              MODULE_DISPLAY="All Modules"
              ;;
            "00-iam")
              MODULE_DISPLAY="IAM"
              ;;
            "01-networking")
              MODULE_DISPLAY="Networking"
              ;;
            "02-kubernetes")
              MODULE_DISPLAY="Kubernetes"
              if [ "$CLUSTERS" != "all" ]; then
                MODULE_DISPLAY="Kubernetes ($CLUSTERS)"
              fi
              ;;
          esac
          
          echo "title=$ACTION_DISPLAY - $MODULE_DISPLAY" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate Inputs
        run: |
          # Validate clusters parameter for kubernetes module
          if [ "${{ github.event.inputs.module }}" == "02-kubernetes" ] || [ "${{ github.event.inputs.module }}" == "all" ]; then
            if [ -z "${{ github.event.inputs.clusters }}" ]; then
              echo "❌ ERROR: clusters parameter cannot be empty for kubernetes module"
              exit 1
            fi
          fi
          
          # Validate destroy confirmation
          if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
              echo "❌ ERROR: You must type 'DESTROY' to confirm resource destruction"
              echo "This is a safety check to prevent accidental deletion."
              exit 1
            fi
            
            # Show what will be destroyed
            echo ""
            echo "⚠️  DESTROY CONFIRMATION"
            echo "═══════════════════════════════════════"
            
            if [ "${{ github.event.inputs.module }}" == "all" ]; then
              echo "You are about to destroy ALL infrastructure:"
              echo "  ✗ 02-kubernetes (clusters: ${{ github.event.inputs.clusters }})"
              echo "  ✗ 01-networking (VNet, NAT, NSG)"
              echo "  ✗ 00-iam (Identities, Resource Group)"
            elif [ "${{ github.event.inputs.module }}" == "02-kubernetes" ]; then
              echo "You are about to destroy Kubernetes clusters:"
              if [ "${{ github.event.inputs.clusters }}" == "all" ]; then
                echo "  ✗ aks-dev"
                echo "  ✗ aks-stg"
                echo "  ✗ aks-prd"
                echo "  ✗ aks-sdx"
              else
                IFS=',' read -ra CLUSTER_ARRAY <<< "${{ github.event.inputs.clusters }}"
                for cluster in "${CLUSTER_ARRAY[@]}"; do
                  echo "  ✗ aks-$cluster"
                done
              fi
              echo ""
              echo "Network and IAM will remain intact."
            elif [ "${{ github.event.inputs.module }}" == "01-networking" ]; then
              echo "You are about to destroy Networking:"
              echo "  ✗ vnet-shared-network"
              echo "  ✗ NAT Gateway"
              echo "  ✗ Network Security Groups"
              echo ""
              echo "⚠️  WARNING: Ensure no AKS clusters exist before destroying network!"
            elif [ "${{ github.event.inputs.module }}" == "00-iam" ]; then
              echo "You are about to destroy IAM:"
              echo "  ✗ Managed Identities (mi-aks-*)"
              echo "  ✗ Resource Group (rg-network)"
              echo ""
              echo "⚠️  WARNING: Ensure network and clusters are destroyed first!"
            fi
            
            echo ""
            echo "This action is IRREVERSIBLE."
            echo "═══════════════════════════════════════"
            echo ""
          fi

      - name: ${{ github.event.inputs.action == 'plan' && '📋 Planning' || github.event.inputs.action == 'apply' && '🚀 Deploying' || '🗑️ Destroying' }} Infrastructure
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set +e  # Don't exit on error, we'll handle it
          
          # Main deployment logic
          if [ "${{ github.event.inputs.module }}" == "all" ]; then
            # For destroy, use reverse order to handle dependencies
            if [ "${{ github.event.inputs.action }}" == "destroy" ]; then
              MODULES="02-kubernetes 01-networking 00-iam"
              echo "🗑️  Destroy mode: Modules will be destroyed in reverse order"
            else
              MODULES="00-iam 01-networking 02-kubernetes"
              echo "🚀 Deploy mode: Modules will be deployed in correct order"
            fi
            echo ""
            
            # Deploy/Destroy all modules
            for module in $MODULES; do
              echo "========================================"
              echo "Deploying module: $module"
              echo "========================================"
              cd terraform/$module
              
              terraform init
              
              # Handle different actions
              case "${{ github.event.inputs.action }}" in
                plan)
                  if [ "$module" == "02-kubernetes" ]; then
                    terraform plan -var="deploy_clusters=${{ github.event.inputs.clusters }}"
                  else
                    terraform plan
                  fi
                  ;;
                  
                apply)
                  # Stream output live via tee so progress is visible while running;
                  # still capture it in a file for the import-detection logic below.
                  TF_APPLY_LOG=$(mktemp)
                  if [ "$module" == "02-kubernetes" ]; then
                    terraform apply -auto-approve -var="deploy_clusters=${{ github.event.inputs.clusters }}" 2>&1 | tee "$TF_APPLY_LOG"
                  else
                    terraform apply -auto-approve 2>&1 | tee "$TF_APPLY_LOG"
                  fi
                  APPLY_EXIT=${PIPESTATUS[0]}
                  APPLY_OUTPUT=$(cat "$TF_APPLY_LOG")

                  # Check if error is "already exists"
                  if [ $APPLY_EXIT -ne 0 ]; then
                    if echo "$APPLY_OUTPUT" | grep -q "already exists.*needs to be imported"; then
                      echo ""
                      echo "⚠️  'Already Exists' error detected!"
                      echo "📋 Multiple resources may need to be imported..."
                      echo ""
                      
                      # Extract ALL resources that need import
                      RESOURCES_TO_IMPORT=$(echo "$APPLY_OUTPUT" | grep -oP 'with \K[a-z_]+\.[a-z_]+(\[[^\]]+\])?' | sort -u)
                      RESOURCE_COUNT=$(echo "$RESOURCES_TO_IMPORT" | wc -l)
                      
                      echo "Found $RESOURCE_COUNT resource(s) that need import:"
                      echo "$RESOURCES_TO_IMPORT"
                      echo ""
                      
                      if [ $RESOURCE_COUNT -gt 5 ]; then
                        echo "❌ Too many resources to auto-import ($RESOURCE_COUNT resources)"
                        echo ""
                        echo "💡 This indicates orphaned resources from previous deployments."
                        echo "Quickest solution:"
                        echo "   1. az group delete --name rg-network --yes --no-wait"
                        echo "   2. Wait 3-5 minutes"
                        echo "   3. Re-run this workflow"
                        exit 1
                      fi
                      
                      # Try to import each resource
                      IMPORT_SUCCESS=true
                      while IFS= read -r RESOURCE_ADDRESS; do
                        if [ -z "$RESOURCE_ADDRESS" ]; then
                          continue
                        fi
                        
                        # Extract ID for this specific resource
                        RESOURCE_ID=$(echo "$APPLY_OUTPUT" | grep -A 2 "with $RESOURCE_ADDRESS" | grep -oP 'ID "\K[^"]+' | head -1)
                        
                        if [ -z "$RESOURCE_ID" ]; then
                          echo "❌ Failed to extract ID for: $RESOURCE_ADDRESS"
                          IMPORT_SUCCESS=false
                          continue
                        fi
                        
                        echo "🔄 Importing: $RESOURCE_ADDRESS"
                        echo "   ID: $RESOURCE_ID"
                        
                        if terraform import "$RESOURCE_ADDRESS" "$RESOURCE_ID"; then
                          echo "✅ Imported successfully!"
                        else
                          echo "❌ Import failed for: $RESOURCE_ADDRESS"
                          IMPORT_SUCCESS=false
                        fi
                        echo ""
                      done <<< "$RESOURCES_TO_IMPORT"
                      
                      if [ "$IMPORT_SUCCESS" = true ]; then
                        echo "✅ All resources imported! Retrying apply..."
                        echo ""
                        
                        # Retry apply
                        if [ "$module" == "02-kubernetes" ]; then
                          terraform apply -auto-approve -var="deploy_clusters=${{ github.event.inputs.clusters }}"
                        else
                          terraform apply -auto-approve
                        fi
                        
                        if [ $? -eq 0 ]; then
                          echo "✅ Apply successful after import!"
                        else
                          echo "❌ Apply failed after import"
                          exit 1
                        fi
                      else
                        echo "❌ Some imports failed"
                        echo ""
                        echo "💡 Manual fix needed:"
                        echo "   az group delete --name rg-network --yes --no-wait"
                        echo "   Then re-run this workflow"
                        exit 1
                      fi
                    else
                      # Different error
                      echo "❌ Terraform apply failed with non-import error"
                      exit 1
                    fi
                  fi
                  ;;
                  
                destroy)
                  if [ "$module" == "02-kubernetes" ]; then
                    terraform destroy -auto-approve -var="deploy_clusters=${{ github.event.inputs.clusters }}"
                  else
                    terraform destroy -auto-approve
                  fi
                  ;;
              esac
              
              cd ../..
            done
          else
            # Deploy single module
            echo "========================================"
            echo "Deploying module: ${{ github.event.inputs.module }}"
            echo "========================================"
            cd terraform/${{ github.event.inputs.module }}
            
            terraform init
            
            # Handle different actions
            case "${{ github.event.inputs.action }}" in
              plan)
                if [ "${{ github.event.inputs.module }}" == "02-kubernetes" ]; then
                  terraform plan -var="deploy_clusters=${{ github.event.inputs.clusters }}"
                else
                  terraform plan
                fi
                ;;
                
              apply)
                # Stream output live via tee so progress is visible while running;
                # still capture it in a file for the import-detection logic below.
                TF_APPLY_LOG=$(mktemp)
                if [ "${{ github.event.inputs.module }}" == "02-kubernetes" ]; then
                  terraform apply -auto-approve -var="deploy_clusters=${{ github.event.inputs.clusters }}" 2>&1 | tee "$TF_APPLY_LOG"
                else
                  terraform apply -auto-approve 2>&1 | tee "$TF_APPLY_LOG"
                fi
                APPLY_EXIT=${PIPESTATUS[0]}
                APPLY_OUTPUT=$(cat "$TF_APPLY_LOG")

                # Check if error is "already exists"
                if [ $APPLY_EXIT -ne 0 ]; then
                  if echo "$APPLY_OUTPUT" | grep -q "already exists.*needs to be imported"; then
                    echo ""
                    echo "⚠️  'Already Exists' error detected!"
                    echo "📋 Multiple resources may need to be imported..."
                    echo ""
                    
                    # Extract ALL resources that need import
                    RESOURCES_TO_IMPORT=$(echo "$APPLY_OUTPUT" | grep -oP 'with \K[a-z_]+\.[a-z_]+(\[[^\]]+\])?' | sort -u)
                    RESOURCE_COUNT=$(echo "$RESOURCES_TO_IMPORT" | wc -l)
                    
                    echo "Found $RESOURCE_COUNT resource(s) that need import:"
                    echo "$RESOURCES_TO_IMPORT"
                    echo ""
                    
                    if [ $RESOURCE_COUNT -gt 5 ]; then
                      echo "❌ Too many resources to auto-import ($RESOURCE_COUNT resources)"
                      echo ""
                      echo "💡 This indicates orphaned resources from previous deployments."
                      echo "Quickest solution:"
                      echo "   1. az group delete --name rg-network --yes --no-wait"
                      echo "   2. Wait 3-5 minutes"
                      echo "   3. Re-run this workflow"
                      exit 1
                    fi
                    
                    # Try to import each resource
                    IMPORT_SUCCESS=true
                    while IFS= read -r RESOURCE_ADDRESS; do
                      if [ -z "$RESOURCE_ADDRESS" ]; then
                        continue
                      fi
                      
                      # Extract ID for this specific resource
                      RESOURCE_ID=$(echo "$APPLY_OUTPUT" | grep -A 2 "with $RESOURCE_ADDRESS" | grep -oP 'ID "\K[^"]+' | head -1)
                      
                      if [ -z "$RESOURCE_ID" ]; then
                        echo "❌ Failed to extract ID for: $RESOURCE_ADDRESS"
                        IMPORT_SUCCESS=false
                        continue
                      fi
                      
                      echo "🔄 Importing: $RESOURCE_ADDRESS"
                      echo "   ID: $RESOURCE_ID"
                      
                      if terraform import "$RESOURCE_ADDRESS" "$RESOURCE_ID"; then
                        echo "✅ Imported successfully!"
                      else
                        echo "❌ Import failed for: $RESOURCE_ADDRESS"
                        IMPORT_SUCCESS=false
                      fi
                      echo ""
                    done <<< "$RESOURCES_TO_IMPORT"
                    
                    if [ "$IMPORT_SUCCESS" = true ]; then
                      echo "✅ All resources imported! Retrying apply..."
                      echo ""
                      
                      # Retry apply
                      if [ "${{ github.event.inputs.module }}" == "02-kubernetes" ]; then
                        terraform apply -auto-approve -var="deploy_clusters=${{ github.event.inputs.clusters }}"
                      else
                        terraform apply -auto-approve
                      fi
                      
                      if [ $? -eq 0 ]; then
                        echo "✅ Apply successful after import!"
                      else
                        echo "❌ Apply failed after import"
                        exit 1
                      fi
                    else
                      echo "❌ Some imports failed"
                      echo ""
                      echo "💡 Quick fix:"
                      echo "   az group delete --name rg-network --yes --no-wait"
                      echo "   Wait 3 minutes, then re-run this workflow"
                      exit 1
                    fi
                  else
                    # Different error
                    echo "❌ Terraform apply failed"
                    exit 1
                  fi
                fi
                ;;
                
              destroy)
                if [ "${{ github.event.inputs.module }}" == "02-kubernetes" ]; then
                  terraform destroy -auto-approve -var="deploy_clusters=${{ github.event.inputs.clusters }}"
                else
                  terraform destroy -auto-approve
                fi
                ;;
            esac
          fi
      
      - name: Deployment Summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 Deployment Summary"
          echo "=========================================="
          echo ""
          echo "Module: ${{ github.event.inputs.module }}"
          echo "Action: ${{ github.event.inputs.action }}"
          echo "Clusters: ${{ github.event.inputs.clusters }}"
          echo "Status: ${{ job.status }}"
          echo ""
          
          if [ "${{ job.status }}" == "success" ]; then
            if [ "${{ github.event.inputs.action }}" == "plan" ]; then
              echo "✅ Planning completed successfully!"
              echo ""
              echo "Review the plan above. If OK:"
              echo "  Run workflow again with action: apply"
            elif [ "${{ github.event.inputs.action }}" == "destroy" ]; then
              echo "✅ Destruction completed successfully!"
              echo ""
              echo "Resources have been removed from Azure."
              echo ""
              if [ "${{ github.event.inputs.module }}" == "all" ]; then
                echo "All infrastructure modules destroyed:"
                echo "  - 02-kubernetes (AKS clusters)"
                echo "  - 01-networking (VNet, NAT, NSG)"
                echo "  - 00-iam (Managed Identities, Resource Group)"
              else
                echo "Module destroyed: ${{ github.event.inputs.module }}"
              fi
            else
              echo "✅ Infrastructure deployment completed successfully!"
              echo ""
              echo "Resources are now live in Azure."
            fi
          else
            echo "❌ Deployment failed."
            echo ""
            echo "💡 If you saw 'already exists' error, quickest fix:"
            echo "   1. Run: az group delete --name rg-network --yes --no-wait"
            echo "   2. Wait 3 minutes"
            echo "   3. Re-run this workflow"
            echo ""
            echo "📚 For permanent solution, see README.md 'Remote State Backend' section"
          fi
          echo ""
